name: Eitaa Daily Forward

on:
  schedule:
    - cron: '30 2 * * *'   # ۶ صبح ایران
    - cron: '30 11 * * *'  # ۳ بعدازظهر ایران
    - cron: '30 13 * * *'  # ۵ بعدازظهر ایران
    - cron: '30 17 * * *'  # ۹ شب ایران
  workflow_dispatch:

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Run the script
        env:
          EITAA_CHANNEL: ${{ secrets.EITAA_CHANNEL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
